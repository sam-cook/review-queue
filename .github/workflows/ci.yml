name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift version
        run: swift --version
      - name: Test
        run: scripts/test.sh
      - name: Build the app
        run: scripts/build-app.sh
      - name: Smoke test
        run: |
          "dist/Review Queue.app/Contents/MacOS/ReviewQueue" --version
          "dist/Review Queue.app/Contents/MacOS/ReviewQueue" --snapshot /tmp/demo.png --demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-queue-app
          path: dist/Review Queue.app

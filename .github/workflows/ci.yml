name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: scripts/test.sh
      - name: Build the app
        run: scripts/build-app.sh
      - name: Smoke test
        run: |
          "dist/Review Queue.app/Contents/MacOS/ReviewQueue" --version
          "dist/Review Queue.app/Contents/MacOS/ReviewQueue" --snapshot /tmp/demo.png --demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-queue-app
          path: dist/Review Queue.app

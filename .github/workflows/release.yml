name: Release

# release-please keeps a "chore(main): release x.y.z" pull request up to date with the
# version bump and changelog from Conventional Commits on main. Merging that PR tags the
# release; this workflow then builds the app and attaches the zip.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Rebuild and upload the app for an existing release tag (for example v1.0.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A personal access token lets CI run on the release PR; GITHUB_TOKEN works without it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # for the build number
      - name: Check the tag matches VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$TAG"
      - name: Test
        run: scripts/test.sh
      - name: Build and zip
        run: make zip
      - name: Smoke test
        run: '"dist/Review Queue.app/Contents/MacOS/ReviewQueue" --version'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/ReviewQueue-*.zip --clobber
      - name: Update the Homebrew tap
        # Needs a token that can push to sam-cook/homebrew-tap (Contents: read and write):
        # HOMEBREW_TAP_TOKEN, or RELEASE_PLEASE_TOKEN if that one also covers the tap.
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap."; exit 0; fi
          version="${TAG#v}"
          sha="$(shasum -a 256 "dist/ReviewQueue-$version.zip" | cut -d' ' -f1)"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/sam-cook/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/$version/" -e "s/__SHA256__/$sha/" packaging/homebrew/review-queue.rb > tap/Casks/review-queue.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/review-queue.rb
          git diff --cached --quiet && { echo "Cask already up to date."; exit 0; }
          git commit -m "review-queue $version"
          git push
